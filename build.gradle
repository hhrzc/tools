plugins {
    id 'java-library'
    id 'signing'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}

group = 'io.github.hhrzc'

subprojects {
    apply plugin: 'java'
    apply plugin: 'com.vanniktech.maven.publish'

    repositories {
        mavenCentral()
    }

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
        testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
    }

    test {
        useJUnitPlatform()
    }

    // Shared Maven Central publishing config for every module.
    // Module-specific bits (coordinates, name, description) live in each
    // module's own build.gradle.
    mavenPublishing {
        publishToMavenCentral()
        signAllPublications()

        pom {
            url = "https://github.com/hhrzc/tools"
            licenses {
                license {
                    name = "MIT License"
                    url = "https://opensource.org/licenses/MIT"
                    distribution = "https://opensource.org/licenses/MIT"
                }
            }
            developers {
                developer {
                    id = "hhrzc"
                    name = "Valentyn"
                    url = "https://github.com/hhrzc/"
                }
            }
            scm {
                url = "https://github.com/hhrzc/tools/"
                connection = "scm:git:git://github.com/hhrzc/tools.git"
                developerConnection = "scm:git:ssh://git@github.com/hhrzc/tools.git"
            }
        }
    }
}